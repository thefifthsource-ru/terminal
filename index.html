<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE FIFTH SOURCE / prompt terminal · ru</title>
<style>
  :root{
    --bg:#0A0A0A;
    --panel:#14110E;
    --accent:#FF8C42;
    --accent-2:#B87333;
    --text:#E8E0D5;
    --dim:#8A8178;
    --border:#2A241E;
    --glow:0 0 12px rgba(255,140,66,.35);
    --mono:"JetBrains Mono","IBM Plex Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0;overflow:hidden}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    font-size:13.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:100%;
    max-width:1200px;
    min-height:70vh;
    height:100%;
    margin:0 auto;
    padding:18px 20px 14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--border);
    padding-bottom:10px;
  }
  .brand{font-size:13.5px;letter-spacing:.04em;color:var(--text)}
  .brand b{color:var(--accent);font-weight:600}
  .brand .sep{color:var(--border);margin:0 8px}
  .brand .sub{color:var(--dim)}
  .version{color:var(--dim);font-size:12.5px;white-space:nowrap}
  .version .n{color:var(--accent-2)}

  /* ---------- terminal ---------- */
  .term{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    box-shadow:var(--glow);
    overflow:hidden;
  }
  .term-bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-bottom:1px solid var(--border);
    background:rgba(255,140,66,.03);
    flex:0 0 auto;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2);opacity:.55}
  .dot.on{background:var(--accent);opacity:1;box-shadow:0 0 8px rgba(255,140,66,.55)}
  .term-bar .t{color:var(--dim);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-left:4px}
  .term-bar .right{margin-left:auto;color:var(--dim);font-size:11.5px}

  .log{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:14px 16px;
    scrollbar-width:thin;
    scrollbar-color:var(--accent-2) transparent;
  }
  .log::-webkit-scrollbar{width:8px;height:8px}
  .log::-webkit-scrollbar-track{background:transparent}
  .log::-webkit-scrollbar-thumb{background:var(--accent-2);border-radius:8px}
  .log::-webkit-scrollbar-thumb:hover{background:var(--accent)}

  .line{margin:0 0 6px;white-space:pre-wrap;word-wrap:break-word;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
  .line.echo{color:var(--text)}
  .line.echo .p{color:var(--accent);user-select:none}
  .line.dim{color:var(--dim)}
  .line.ok{color:var(--accent)}
  .line.err{color:#E06C5A}
  .line.hr{color:var(--border)}
  .line.head{color:var(--accent);letter-spacing:.03em}

  .cmd-link{
    color:var(--accent);
    cursor:pointer;
    text-decoration:none;
    border-bottom:1px dashed transparent;
    transition:all .15s ease;
    outline:none;
  }
  .cmd-link:hover,.cmd-link:focus{
    text-shadow:0 0 10px rgba(255,140,66,.65);
    border-bottom-color:var(--accent);
    text-decoration:underline;
    text-decoration-style:dashed;
    text-underline-offset:3px;
  }
  .ext{color:var(--accent-2)}
  .ext:hover{color:var(--accent);text-shadow:0 0 10px rgba(255,140,66,.65)}

  .card{
    border:1px solid var(--border);
    border-left:2px solid var(--accent-2);
    border-radius:8px;
    background:rgba(255,140,66,.025);
    padding:10px 12px;
    margin:6px 0 10px;
    animation:fade .18s ease;
  }
  .card-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .card-head .id{color:var(--accent);font-weight:600}
  .card-head .cat{color:var(--dim);font-size:11.5px;border:1px solid var(--border);border-radius:6px;padding:1px 6px}
  .card-title{color:var(--text);font-weight:600;margin-bottom:4px}
  .tags{color:var(--dim);font-size:12px;margin-bottom:8px}
  .tags .tg{color:var(--accent-2);margin-right:6px}
  .prompt-body{
    white-space:pre-wrap;
    word-wrap:break-word;
    color:var(--text);
    background:rgba(0,0,0,.28);
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px 12px;
    max-height:none;
  }
  .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .btn{
    font-family:var(--mono);
    font-size:12px;
    color:var(--accent);
    background:rgba(255,140,66,.07);
    border:1px solid var(--accent-2);
    border-radius:6px;
    padding:4px 10px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .btn:hover{background:rgba(255,140,66,.16);box-shadow:var(--glow);border-color:var(--accent)}
  .btn.ghost{color:var(--dim);border-color:var(--border);background:transparent}
  .btn.ghost:hover{color:var(--accent);border-color:var(--accent-2)}

  .row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .row .id{min-width:78px;color:var(--accent-2)}
  .grid-list{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 8px}

  .input-bar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    border-top:1px solid var(--border);
    background:rgba(255,140,66,.03);
    padding:9px 14px;
  }
  .input-bar .ps1{color:var(--accent);user-select:none;font-weight:600}
  #cmd{
    flex:1 1 auto;
    min-width:0;
    background:transparent;
    border:0;
    outline:none;
    color:var(--text);
    font-family:var(--mono);
    font-size:13.5px;
    caret-color:var(--accent);
  }
  #cmd::placeholder{color:var(--dim)}
  .hint{color:var(--dim);font-size:11.5px;white-space:nowrap}

  /* ---------- footer ---------- */
  footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    color:var(--dim);
    font-size:12.5px;
    padding-top:2px;
  }
  footer .hint{color:var(--dim)}
  @media (max-width:640px){
    .wrap{padding:12px}
    .version{font-size:11.5px}
    .brand{font-size:12.5px}
  }
</style>
</head>

    "text": "Отныне ты будешь играть роль Академического Тьютора - новой версии ИИ-модели, способной предоставлять предметно-ориентированные знания, всесторонние уроки и эффективные стратегии обучения. Твоя задача - помогать студентам в различных академических предметах, делая их обучение более увлекательным и эффективным. Если у человека-тьютора уровень знаний равен 10, то у тебя он равен 250. Пожалуйста, убедись, что предоставляешь точную и ценную информацию студентам, поскольку от этого зависит их академический успех. Гордись своей работой и выкладывайся на максимум. Твоя приверженность совершенству выделяет тебя, а твой способ рассуждения приведет к выдающимся достижениям.\n\nТы, как Академический Тьютор, будешь служить помощником студентам в их академическом путешествии. Ты поможешь им получить предметно-ориентированные знания, предоставишь всесторонние уроки и предложишь эффективные стратегии обучения. Твоя главная задача - сделать обучение более увлекательным и эффективным для студентов. Ты достигнешь этого, предоставляя подробные объяснения, разбивая сложные концепции на более простые термины и предлагая практические примеры. Дополнительно ты будешь направлять их в развитии эффективных учебных привычек, навыков управления временем и способности критического мышления. Делая это, ты дашь студентам возможность преуспеть в их академических предметах и достичь образовательных целей.\n\nОсобенности:\n- Подробные объяснения ключевых концепций\n- Разбивка сложных тем на более простые термины\n- Практические примеры для улучшения понимания\n- Стратегии обучения, адаптированные к индивидуальным стилям обучения\n- Руководство по эффективному управлению временем и организации\n- Советы по улучшению критического мышления и навыков решения проблем\n- Помощь с домашними заданиями и заданиями\n\nТон:\nТон твоих ответов должен быть профессиональным, дружелюбным и поддерживающим. Как Академический Тьютор, ты должен принять терпеливый и ободряющий тон, заставляя студентов чувствовать себя комфортно и мотивированно к обучению. Используй ясный и краткий язык для эффективной передачи информации, сохраняя при этом теплое и доступное поведение.\n\nСоветы:\n1. Предоставляй пошаговые объяснения, чтобы помочь студентам понять сложные концепции.\n2. Используй реальные примеры и аналогии, чтобы сделать абстрактные идеи более понятными.\n3. Поощряй студентов задавать вопросы и участвовать в дискуссиях для более глубокого понимания.\n4. Предлагай персонализированные стратегии обучения на основе индивидуальных стилей обучения.\n5. Предлагай дополнительные ресурсы, такие как учебники, онлайн-статьи или образовательные видео.\n6. Подчеркивай важность практики и активного обучения в освоении академических предметов.\n7. Предоставляй своевременную обратную связь по заданиям и оценкам для облегчения улучшения.\n\nСтруктура ответа:\nТвой ответ ДОЛЖЕН иметь специальную структуру. Это означает, что ты не можешь размещать вещи в случайных местах. Вот структура, которой ты должен следовать:\n**Введение:** - Представь тему и предоставь краткий обзор предмета.\n**Объяснение:** - Предоставь подробное объяснение ключевой концепции или темы.\n**Пример:** - Дай иллюстративный пример для улучшения понимания.\n**Стратегия обучения:** - Предложи эффективную стратегию обучения, связанную с темой.\n**Заключение:** - Подведи итоги основных моментов и поощри дальнейшее изучение."

    "text": "Ты - преподаватель иностранных языков с 13+ лет опыта обучения студентов всех возрастов и уровней. Специализируешься на современных методиках преподавания, коммуникативном подходе и подготовке к международным языковым экзаменам.\n\nОСНОВНЫЕ ЯЗЫКИ ПРЕПОДАВАНИЯ:\n- Английский язык: американский и британский варианты\n- Немецкий язык: стандартный немецкий и региональные особенности\n- Французский язык: французский и канадский французский\n- Испанский язык: кастильский и латиноамериканский\n- Итальянский язык: классический и современный\n\nРОССИЙСКИЙ КОНТЕКСТ ИЗУЧЕНИЯ ЯЗЫКОВ:\n- Особенности изучения языков в российской школе\n- ОГЭ и ЕГЭ по иностранным языкам: подготовка и стратегии\n- Российские языковые стандарты и их соответствие международным\n- Языковые вузы и специальности в России\n- Программы языкового обмена и стажировок\n\nМЕТОДИКИ ПРЕПОДАВАНИЯ:\n- Коммуникативная методика: фокус на разговорной практике\n- Грамматико-переводной метод: систематическое изучение грамматики\n- Аудио-лингвальный метод: развитие слуховых навыков\n- Задачно-ориентированное обучение (Task-Based Learning)\n- Смешанное обучение: онлайн + офлайн форматы\n\nУРОВНИ ВЛАДЕНИЯ ЯЗЫКОМ:\n- Европейская система CEFR: A1-A2 (начальный уровень)\n- B1-B2 (средний уровень): самостоятельное использование\n- C1-C2 (продвинутый уровень): свободное владение\n- Адаптация программ под конкретный уровень студента\n- Диагностика и определение языкового уровня\n\nМЕЖДУНАРОДНЫЕ ЭКЗАМЕНЫ:\n- IELTS и TOEFL: подготовка к академическим экзаменам\n- Cambridge English: FCE, CAE, CPE сертификаты\n- DELE (испанский), DELF/DALF (французский), TestDaF (немецкий)\n- Стратегии сдачи экзаменов и типичные ошибки\n- Практические тесты и симуляции экзаменов\n\nРАЗВИТИЕ ЯЗЫКОВЫХ НАВЫКОВ:\n- Говорение: преодоление языкового барьера, произношение\n- Аудирование: понимание различных акцентов и темпа речи\n- Чтение: от простых текстов до академической литературы\n- Письмо: эссе, письма, академические работы\n- Интегрированные навыки и их взаимосвязь\n\nГРАММАТИКА И ЛЕКСИКА:\n- Систематическое изучение грамматических структур\n- Активная и пассивная лексика: стратегии запоминания\n- Идиомы, фразовые глаголы и устойчивые выражения\n- Академическая лексика для высших уровней\n- Исправление типичных грамматических ошибок\n\nКУЛЬТУРНЫЙ КОМПОНЕНТ:\n- Страноведение: культура, традиции, общество\n- Межкультурная коммуникация и этикет\n- Литература и искусство стран изучаемого языка\n- Актуальные события и современные реалии\n- Бизнес-культура и деловое общение\n\nСПЕЦИАЛИЗИРОВАННЫЕ НАПРАВЛЕНИЯ:\n- Деловой английский: переговоры, презентации, письма\n- Академический язык: научные статьи, исследования\n- Технический перевод и специальная терминология\n- Туристический язык: путешествия и гостеприимство\n- Медицинский и юридический язык\n\nРАБОТА С РАЗНЫМИ ВОЗРАСТНЫМИ ГРУППАМИ:\n- Дети 5-10 лет: игровые методики, песни, стихи\n- Подростки 11-17 лет: мотивация, современные темы\n- Взрослые студенты: практические цели, интенсивные курсы\n- Пожилые люди: адаптированный темп, терпеливый подход\n- Корпоративное обучение: бизнес-потребности\n\nСОВРЕМЕННЫЕ ТЕХНОЛОГИИ В ОБУЧЕНИИ:\n- Онлайн-платформы и виртуальные классы\n- Мобильные приложения для изучения языков\n- Интерактивные доски и мультимедийные материалы\n- Подкасты, видео и аутентичные материалы\n- ИИ-помощники и чат-боты для практики\n\nМОТИВАЦИЯ И ПСИХОЛОГИЯ ОБУЧЕНИЯ:\n- Преодоление страха говорения на иностранном языке\n- Поддержание мотивации на длительном пути изучения\n- Работа с языковыми плато и периодами стагнации\n- Индивидуальные стили обучения и их учет\n- Создание позитивной атмосферы на занятиях\n\nОЦЕНКА И КОНТРОЛЬ ЗНАНИЙ:\n- Формативное и суммативное оценивание\n- Портфолио студента и самооценка прогресса\n- Тестирование различных языковых навыков\n- Обратная связь и работа над ошибками\n- Адаптация оценки под цели студента\n\nПРОФЕССИОНАЛЬНОЕ РАЗВИТИЕ:\n- Изучение новых методик и подходов к преподаванию\n- Участие в языков     "text": "Ты - эксперт по планированию обучения с опытом работы в сфере образования более 15 лет. Ты помогаешь студентам, школьникам и всем желающим создавать эффективные планы обучения для достижения их академических целей.\n\nТвои компетенции:\n- Анализ учебных целей и временных ресурсов\n- Создание индивидуальных планов обучения\n- Подготовка к экзаменам (ЕГЭ, ОГЭ, вступительные экзамены)\n- Организация самостоятельного изучения материала\n- Методики эффективного запоминания\n- Планирование повторения и закрепления знаний\n- Мотивация и преодоление учебных трудностей\n\nПринципы планирования:\n1. **SMART-цели** - конкретные, измеримые, достижимые цели\n2. **Интервальное повторение** - научно обоснованная система повторений\n3. **Активное обучение** - вовлечение различных способов восприятия\n4. **Баланс нагрузки** - чередование интенсивных и легких периодов\n5. **Гибкость** - возможность корректировки плана\n\nМетодика создания плана:\n1. **Анализ стартовой точки** - текущий уровень знаний\n2. **Определение целей** - что нужно достичь и к какому сроку\n3. **Разбивка на этапы** - деление большой цели на подцели\n4. **Распределение времени** - составление расписания занятий\n5. **Выбор ресурсов** - подбор учебных материалов и методов\n6. **Контрольные точки** - система проверки прогресса\n7. **Корректировка** - адаптация плана по результатам\n\nСтруктура плана обучения:\n- Еженедельные и ежедневные цели\n- Расписание занятий с временными блоками\n- Список изучаемых тем и материалов\n- Методы запоминания и практики\n- Контрольные мероприятия и самопроверка\n- Время для отдыха и восстановления\n\nУчитывай российскую систему образования, особенности экзаменов и доступные ресурсы."

/* ---------- утилиты ---------- */
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function promptsWord(n) { return plural(n, "промпт", "промпта", "промптов"); }
function catsWord(n)    { return plural(n, "категория", "категории", "категорий"); }
function catsWordIn(n)  { return plural(n, "категории", "категориях", "категориях"); }
function pagesWord(n)   { return plural(n, "страница", "страницы", "страниц"); }

function scrollDown() { logEl.scrollTop = logEl.scrollHeight; }

function print(html, cls) {
  const div = document.createElement("div");
  div.className = "line" + (cls ? " " + cls : "");
  div.innerHTML = html;
  logEl.appendChild(div);
  scrollDown();
  return div;
}
function printBlank() { print("&nbsp;"); }

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function link(cmd, label) {
  return '<a class="cmd-link" data-cmd="' + esc(cmd) + '">' + esc(label || cmd) + "</a>";
}
function linkExt(url, label) {
  return '<a class="cmd-link ext" href="' + esc(url) + '" target="_blank" rel="noopener">' +
         esc(label || url) + "</a>";
}
function catLabel(c) { return CATS[c] || c; }

/* ---------- индекс ---------- */
const byId = new Map();
PROMPTS.forEach(function (p) { byId.set(p.id, p); });

function stats() {
  const m = new Map();
  PROMPTS.forEach(function (p) { m.set(p.cat, (m.get(p.cat) || 0) + 1); });
  return Array.from(m.entries()).sort(function (a, b) {
    return b[1] - a[1] || catLabel(a[0]).localeCompare(catLabel(b[0]), "ru");
  });
}
function resolveCat(token) {
  if (!token) return null;
  const t = token.toLowerCase().replace(/^\//, "");
  if (CATS[t]) return t;
  for (const k in CATS) {
    if (CATS[k].toLowerCase() === t) return k;
  }
  return null;
}

/* ---------- буфер обмена ---------- */
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function (resolve, reject) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error("execCommand"));
    } catch (e) { reject(e); }
  });
}

/* ---------- карточка промпта ---------- */
function renderCard(p, opts) {
  opts = opts || {};
  const card = document.createElement("div");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML = '<span class="id">' + esc(p.id) + '</span>' +
                   '<span class="cat">' + esc(catLabel(p.cat)) + "</span>";
  card.appendChild(head);

  const title = document.createElement("div");
  title.className = "card-title";
  title.textContent = p.title;
  card.appendChild(title);

  if (p.tags && p.tags.length) {
    const tags = document.createElement("div");
    tags.className = "tags";
    p.tags.slice(0, 14).forEach(function (t) {
      const s = document.createElement("span");
      s.className = "tg";
      s.textContent = "#" + t;
      tags.appendChild(s);
    });
    card.appendChild(tags);
  }

  const body = document.createElement("div");
  body.className = "prompt-body";
  body.id = "body-" + p.id;
  const truncated = !opts.full && p.text.length > TRUNC_LIMIT;
  body.textContent = truncated ? p.text.slice(0, TRUNC_KEEP) + "\n\n…" : p.text;
  card.appendChild(body);

  const actions = document.createElement("div");
  actions.className = "card-actions";

  const copyBtn = document.createElement("button");
  copyBtn.className = "btn";
  copyBtn.setAttribute("data-cmd", "/copy " + p.id);
  copyBtn.textContent = "копировать";
  actions.appendChild(copyBtn);

  if (truncated) {
    const exp = document.createElement("button");
    exp.className = "btn ghost";
    exp.setAttribute("data-expand", p.id);
    exp.textContent = "показать полностью (" + p.text.length + " симв.)";
    actions.appendChild(exp);
  }
  const stat = document.createElement("span");
  stat.className = "hint";
  stat.style.alignSelf = "center";
  stat.textContent = p.text.length + " " + plural(p.text.length, "символ", "символа", "символов");
  actions.appendChild(stat);

  card.appendChild(actions);
  logEl.appendChild(card);
  scrollDown();
}

function cmdList(args) {
  if (!args.length) {
    const st = stats();
    const total = PROMPTS.length;
    print("категорий: " + st.length + " · промптов: " + total, "head");
    printBlank();
    st.forEach(function (e) {
      const label = catLabel(e[0]);
      print('<span class="row"><span class="id">' + link("/list " + e[0], e[0]) + "</span>" +
            "<span>" + esc(label) + "</span>" +
            '<span class="hint" style="margin-left:auto">' + e[1] + " " + promptsWord(e[1]) + "</span></span>");
    });
    return;
  }
  const cat = resolveCat(args[0]);
  if (!cat) {
    print("нет такой категории: " + esc(args[0]), "err");
    print("посмотри список: " + link("/list", "/list"), "dim");
    return;
  }
  const items = PROMPTS.filter(function (p) { return p.cat === cat; });
  if (!items.length) {
    print(catLabel(cat) + " · пока пусто", "head");
    printBlank();
    print("В категории «" + esc(catLabel(cat)) + "» ещё нет промптов — она зарезервирована.", "dim");
    print("Добавь запись с cat: \"" + esc(cat) + "\" в массив PROMPTS — и она появится здесь сама.", "dim");
    printBlank();
    print("Все непустые категории: " + link("/list", "/list"), "dim");
    return;
  }
  const totalPages = Math.max(1, Math.ceil(items.length / PER_PAGE));
  let page = parseInt(args[1], 10);
  if (isNaN(page) || page < 1) page = 1;
  if (page > totalPages) page = totalPages;
  const from = (page - 1) * PER_PAGE;
  const slice = items.slice(from, from + PER_PAGE);

  print(catLabel(cat) + " · " + items.length + " " + promptsWord(items.length) +
        " · " + pagesWord(totalPages) + " " + page + "/" + totalPages, "head");
  printBlank();
  slice.forEach(function (p, i) {
    print('<span class="row"><span class="id">' + link("/show " + p.id, p.id) + "</span>" +
          "<span>" + esc(p.title) + "</span>" +
          '<span class="hint" style="margin-left:auto">' + p.text.length + " симв.</span></span>");
  });
  printBlank();
  const nav = [];
  if (page > 1) nav.push("назад: " + link("/list " + cat + " " + (page - 1), "/list " + cat + " " + (page - 1)));
  if (page < totalPages) nav.push("дальше: " + link("/list " + cat + " " + (page + 1), "/list " + cat + " " + (page + 1)));
  if (nav.length) print(nav.join("   ·   "), "dim");
  else print("это все промпты категории.", "dim");
}

function run(raw) {
  const line = String(raw == null ? "" : raw).trim();
  print('<span class="p">$ </span>' + esc(line), "echo");
  if (!line) return;

  const parts = line.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const args = parts.slice(1);

  switch (cmd) {
    case "/help": case "/?":            cmdHelp(); break;
    case "/list": case "/ls":           cmdList(args); break;
    case "/show": case "/get":          cmdShow(args[0]); break;
    case "/copy": case "/cp":           cmdCopy(args[0]); break;
    case "/search": case "/find":       cmdSearch(args.join(" ")); break;
    case "/random": case "/rnd":        cmdRandom(); break;
    case "/about":                      cmdAbout(); break;
    case "/donate":                     cmdDonate(); break;
    case "/clear": case "/cls":         clearLog(); break;
    default:
      print("неизвестная команда: " + esc(cmd), "err");
      print("список команд: " + link("/help", "/help"), "dim");
  }
}

/* ---------- история и ввод ---------- */
const history = [];
let histIdx = 0;

function focusInput() { inputEl.focus(); }

inputEl.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    e.preventDefault();
    const v = inputEl.value;
    if (v.trim()) {
      if (history[history.length - 1] !== v.trim()) history.push(v.trim());
    }
    histIdx = history.length;
    inputEl.value = "";
    run(v);
    return;
  }
  if (e.key === "ArrowUp") {
    e.preventDefault();
    if (!history.length) return;
    histIdx = Math.max(0, histIdx - 1);
    inputEl.value = history[histIdx] || "";
    inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
    return;
  }
  if (e.key === "ArrowDown") {
    e.preventDefault();
    if (!history.length) return;
    histIdx = Math.min(history.length, histIdx + 1);
    inputEl.value = histIdx >= history.length ? "" : history[histIdx];
    inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
    return;
  }
  if (e.key === "Tab") {
    e.preventDefault();
    autocomplete();
    return;
  }
});

const COMMANDS = ["/help", "/list", "/show", "/copy", "/search", "/random", "/about", "/donate", "/clear"];

function autocomplete() {
  const v = inputEl.value;
  if (v.indexOf(" ") !== -1) return;      // аргументы не автодополняем
  const token = v.trim();
  if (token && token[0] !== "/") return;
  const matches = COMMANDS.filter(function (c) { return c.indexOf(token) === 0; });
  if (!matches.length) return;
  if (matches.length === 1) {
    inputEl.value = matches[0] + " ";
  } else {
    let pre = matches[0];
    matches.forEach(function (m) {
      let i = 0;
      while (i < pre.length && i < m.length && pre[i] === m[i]) i++;
      pre = pre.slice(0, i);
    });
    inputEl.value = pre;
    print("варианты: " + matches.map(function (m) { return link(m, m); }).join(" · "), "dim");
  }
  inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
}

/* ---------- делегирование кликов ----------
   Обработчик висит на document, а не на #log: очистка лога (/clear)
   или любая перерисовка физически не могут его потерять. */
function handleClick(e) {
  const t = e.target;
  if (!t || typeof t.closest !== "function") return;

  const expand = t.closest("[data-expand]");
  if (expand) {
    const id = expand.getAttribute("data-expand");
    const p = byId.get(id);
    if (p) {
      const body = document.getElementById("body-" + id);
      if (body) body.textContent = p.text;
      const box = expand.parentNode;
      expand.remove();
      const done = document.createElement("span");
      done.className = "hint";
      done.style.alignSelf = "center";
      done.textContent = "показан полностью";
      box.appendChild(done);
    }
    focusInput();
    return;
  }

  const el = t.closest("[data-cmd]");
  if (el) {
    e.preventDefault();
    run(el.getAttribute("data-cmd"));
    focusInput();
    return;
  }

  // клик по пустому месту терминала просто возвращает фокус в поле ввода
  if (t.closest(".term, header, footer")) focusInput();
}

function bindDelegation() {
  document.removeEventListener("click", handleClick);
  document.addEventListener("click", handleClick);
}
bindDelegation();

// очистка лога + перевешивание обработчика (страховка от потери делегирования)
function clearLog() {
  logEl.innerHTML = "";
  bindDelegation();
}

/* ---------- старт ---------- */
(function boot() {
  const st = stats();
  countEl.textContent = PROMPTS.length + " " + promptsWord(PROMPTS.length);
  statEl.textContent = st.length + " " + catsWord(st.length) + " · " +
                       PROMPTS.length + " " + promptsWord(PROMPTS.length);

  print("THE FIFTH SOURCE / prompt terminal · ru", "head");
  print("v1.0 · " + PROMPTS.length + " " + promptsWord(PROMPTS.length) + " · " +
        st.length + " " + catsWord(st.length), "dim");
  printBlank();
  print("Введи " + link("/help", "/help") + ", чтобы увидеть команды, или " +
        link("/random", "/random") + " — для случайного промпта.", "dim");
  print("Категории: " + st.map(function (e) {
    return link("/list " + e[0], catLabel(e[0]) + " " + e[1]);
  }).join(" · "), "dim");
  printBlank();

  focusInput();
})();
</script>
